[project]
name = "cleanrl-style"
version = "0.1.0"
description = "CleanRL-style single-file deep RL on macOS"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core
    "torch>=2.5,<2.7",
    "numpy>=1.26,<2.2",       # gymnasium 1.x doesn't love numpy 2.2+ yet
    "gymnasium[classic-control,box2d,mujoco]>=1.0.0",
    # CLI parsing — CleanRL uses tyro, which is excellent and functional
    "tyro>=0.8.0",
    # Logging
    "tensorboard>=2.18",
    "wandb>=0.18",            # optional but worth having
    # Video capture for env rollouts
    "moviepy>=1.0.3",
    "imageio>=2.34",
    # Misc
    "rich>=13.0",
    "tqdm>=4.66",
    "einops>=0.8.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "ipython>=8.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "ruff>=0.6",
    "pytest>=8.0",
    "optuna>=4.8.0",
]

# Optional extras you can pull in later
[project.optional-dependencies]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "flax>=0.9", "optax>=0.2", "chex>=0.1.86"]
atari = ["ale-py>=0.10", "opencv-python>=4.10", "autorom[accept-rom-license]>=0.6"]
lightning = ["lightning>=2.4", "litdata>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cleanrl_utils"]

# Pin torch to a CUDA 12.4 wheel — system NVIDIA driver reports CUDA 12.4,
# so cu13x wheels (torch 2.7+) crash with "driver too old" and fall back to CPU.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
